<rect x="0" y="0" width="375" height="72" fill="#FCFBF8" stroke="#C9C6BF" stroke-width="0"/><svg x="20" y="17" width="98" height="38" viewBox="0 0 98 38" overflow="hidden"><image href="../../assets/logos/tsugi_wordmark.png" x="0" y="0" width="98" height="38" preserveAspectRatio="xMidYMid meet"/></svg><text x="308" y="38" fill="#20201F" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="end" letter-spacing="0.6"><tspan x="308" dy="0">RESERVATION</tspan></text><rect x="327" y="16" width="28" height="40" fill="none" stroke="none" stroke-width="0"/><rect x="327" y="28" width="28" height="1" fill="#20201F" stroke="none" stroke-width="0"/><rect x="335" y="38" width="20" height="1" fill="#20201F" stroke="none" stroke-width="0"/>
<rect x="0" y="72" width="375" height="680" fill="#FCFBF8" stroke="none" stroke-width="0"/><svg x="0" y="72" width="375" height="340" viewBox="0 0 375 340" overflow="hidden"><image href="../../assets/images/exterior/01_hero_exterior.png" x="0" y="0" width="375" height="340" preserveAspectRatio="xMidYMid slice"/></svg><text x="20" y="498" fill="#20201F" font-family="Inter, sans-serif" font-size="44" font-weight="800" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">泊まるために、</tspan><tspan x="20" dy="49.28">部屋を減らした。</tspan></text><text x="20" y="594" fill="#20201F" font-family="Inter, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">1968年に建てられた旅館を、</tspan><tspan x="20" dy="26.4">残すものを選びながら8室の宿へ。</tspan></text><text x="20" y="702" fill="#20201F" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="1.5"><tspan x="20" dy="0">1968 — 2026</tspan></text>
<rect x="0" y="752" width="375" height="470" fill="#F1F0EC" stroke="none" stroke-width="0"/><text x="20" y="860" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">00 — INTRODUCTION</tspan></text><text x="20" y="932" fill="#20201F" font-family="Inter, sans-serif" font-size="38" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">残すものを選ぶ。</tspan></text><text x="20" y="986" fill="#20201F" font-family="Inter, sans-serif" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">古いものをすべて残すのでも、</tspan><tspan x="20" dy="28">すべて新しくするのでもない。</tspan><tspan x="20" dy="28"> </tspan><tspan x="20" dy="28">残すもの、変えるもの、</tspan><tspan x="20" dy="28">なくすものを選び、</tspan><tspan x="20" dy="28">現在の滞在へ継ぎ直す。</tspan></text><rect x="20" y="1158" width="335" height="1" fill="#C9C6BF" stroke="none" stroke-width="0"/>
<rect x="0" y="1222" width="375" height="1040" fill="#FCFBF8" stroke="none" stroke-width="0"/><text x="20" y="1330" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">01 — STAY</tspan></text><text x="20" y="1398" fill="#20201F" font-family="Inter, sans-serif" font-size="38" font-weight="800" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">8 rooms.</tspan><tspan x="20" dy="42.56">Less, but more.</tspan></text><svg x="20" y="1474" width="335" height="240" viewBox="0 0 335 240" overflow="hidden"><image href="../../assets/images/rooms/06_room_garden.png" x="0" y="0" width="335" height="240" preserveAspectRatio="xMidYMid slice"/></svg><svg x="115" y="1746" width="240" height="164" viewBox="0 0 240 164" overflow="hidden"><image href="../../assets/images/bath/10_bath_main.png" x="0" y="0" width="240" height="164" preserveAspectRatio="xMidYMid slice"/></svg><svg x="20" y="1942" width="220" height="146" viewBox="0 0 220 146" overflow="hidden"><image href="../../assets/images/dining/12_dinner.png" x="0" y="0" width="220" height="146" preserveAspectRatio="xMidYMid slice"/></svg><text x="20" y="2135" fill="#74716B" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.4"><tspan x="20" dy="0">全8室 / 2–3名 / 温泉 / 朝夕食</tspan></text><rect x="195" y="2192" width="160" height="44" fill="none" stroke="#20201F" stroke-width="1"/><text x="207" y="2216" fill="#20201F" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="207" dy="0">VIEW STAY  →</tspan></text>
<rect x="0" y="2262" width="375" height="520" fill="#20201F" stroke="none" stroke-width="0"/><text x="20" y="2337" fill="#FCFBF8" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.3"><tspan x="20" dy="0">EDIT → SPACE → TIME</tspan></text><text x="14" y="2466" fill="#FCFBF8" font-family="Inter, sans-serif" font-size="86" font-weight="800" text-anchor="start" letter-spacing="0"><tspan x="14" dy="0">12 → 08</tspan></text><text x="20" y="2594" fill="#FCFBF8" font-family="Inter, sans-serif" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">減らした分だけ、</tspan><tspan x="20" dy="44.2">残ったものがある。</tspan></text><text x="20" y="2711" fill="#B9B6AF" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="start" letter-spacing="0.5"><tspan x="20" dy="0">12 rooms / before    08 rooms / now</tspan></text>
<rect x="0" y="2782" width="375" height="930" fill="#F1F0EC" stroke="none" stroke-width="0"/><text x="20" y="2890" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">— — SPACE</tspan></text><text x="20" y="2960" fill="#20201F" font-family="Inter, sans-serif" font-size="36" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">客室ではない</tspan><tspan x="20" dy="42.48">場所にも、</tspan><tspan x="20" dy="42.48">居場所を。</tspan></text><svg x="0" y="3074" width="375" height="258" viewBox="0 0 375 258" overflow="hidden"><image href="../../assets/images/lounge/04_lounge_main.png" x="0" y="0" width="375" height="258" preserveAspectRatio="xMidYMid slice"/></svg><svg x="105" y="3366" width="250" height="218" viewBox="0 0 250 218" overflow="hidden"><image href="../../assets/images/lounge/05_lounge_detail.png" x="0" y="0" width="250" height="218" preserveAspectRatio="xMidYMid slice"/></svg><text x="20" y="3629" fill="#20201F" font-family="Inter, sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">部屋を減らして生まれた場所を、</tspan><tspan x="20" dy="24.75">何もしないための共有空間へ。</tspan></text>
<rect x="0" y="3712" width="375" height="1000" fill="#FCFBF8" stroke="none" stroke-width="0"/><text x="20" y="3820" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">02 — STORY</tspan></text><text x="20" y="3890" fill="#20201F" font-family="Inter, sans-serif" font-size="36" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">古いままでも、</tspan><tspan x="20" dy="43.92">新しいだけでも</tspan><tspan x="20" dy="43.92">ない。</tspan></text><text x="20" y="4034" fill="#20201F" font-family="Inter, sans-serif" font-size="48" font-weight="800" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">KEEP</tspan><tspan x="20" dy="50.400000000000006">CHANGE</tspan><tspan x="20" dy="50.400000000000006">REMOVE</tspan></text><svg x="96" y="4156" width="259" height="198" viewBox="0 0 259 198" overflow="hidden"><image href="../../assets/images/story/14_pillar_beam.png" x="0" y="0" width="259" height="198" preserveAspectRatio="xMidYMid slice"/></svg><svg x="20" y="4392" width="235" height="178" viewBox="0 0 235 178" overflow="hidden"><image href="../../assets/images/story/15_wooden_frames_courtyard.png" x="0" y="0" width="235" height="178" preserveAspectRatio="xMidYMid slice"/></svg><rect x="195" y="4632" width="160" height="44" fill="none" stroke="#20201F" stroke-width="1"/><text x="207" y="4656" fill="#20201F" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="207" dy="0">VIEW STORY  →</tspan></text>
<rect x="0" y="4712" width="375" height="800" fill="#F1F0EC" stroke="none" stroke-width="0"/><text x="20" y="4820" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">03 — EXPERIENCE</tspan></text><text x="20" y="4894" fill="#20201F" font-family="Inter, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">一日を、</tspan><tspan x="20" dy="47.199999999999996">急がない。</tspan></text><svg x="20" y="4980" width="280" height="210" viewBox="0 0 280 210" overflow="hidden"><image href="../../assets/images/experience/23_morning_walk.png" x="0" y="0" width="280" height="210" preserveAspectRatio="xMidYMid slice"/></svg><svg x="170" y="5222" width="185" height="132" viewBox="0 0 185 132" overflow="hidden"><image href="../../assets/images/experience/17_river.png" x="0" y="0" width="185" height="132" preserveAspectRatio="xMidYMid slice"/></svg><text x="20" y="5409" fill="#20201F" font-family="Inter, sans-serif" font-size="15" font-weight="500" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">歩く、浸かる、読む。</tspan><tspan x="20" dy="24.75">予定を増やさないための過ごし方。</tspan></text><rect x="175" y="5448" width="180" height="44" fill="none" stroke="#20201F" stroke-width="1"/><text x="187" y="5472" fill="#20201F" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="187" dy="0">VIEW EXPERIENCE  →</tspan></text>
<rect x="0" y="5512" width="375" height="650" fill="#FCFBF8" stroke="none" stroke-width="0"/><text x="20" y="5620" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">LOCATION</tspan></text><text x="20" y="5686" fill="#20201F" font-family="Inter, sans-serif" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">山と川のあいだに</tspan><tspan x="20" dy="43.52">ある、小さな温泉地。</tspan></text><svg x="20" y="5782" width="335" height="220" viewBox="0 0 335 220" overflow="hidden"><image href="../../assets/images/experience/18_onsen_town.png" x="0" y="0" width="335" height="220" preserveAspectRatio="xMidYMid slice"/></svg><text x="20" y="6051" fill="#74716B" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">駅からバスで約40分 / 温泉街から徒歩8分</tspan></text><rect x="215" y="6094" width="140" height="44" fill="none" stroke="#20201F" stroke-width="1"/><text x="227" y="6118" fill="#20201F" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="227" dy="0">ACCESS  →</tspan></text>
<rect x="0" y="6162" width="375" height="720" fill="#F1F0EC" stroke="none" stroke-width="0"/><rect x="0" y="6162" width="375" height="280" fill="#BAB7B0" stroke="#C9C6BF" stroke-width="1"/><text x="187.5" y="6303" fill="#74716B" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0"><tspan x="187.5" dy="0">24 NIGHT EXTERIOR</tspan><tspan x="187.5" dy="14.3">ASSET PENDING</tspan></text><text x="20" y="6524" fill="#74716B" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2"><tspan x="20" dy="0">NEXT STAY</tspan></text><text x="20" y="6600" fill="#20201F" font-family="Inter, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">次の一泊を、</tspan><tspan x="20" dy="47.199999999999996">ここで。</tspan></text><rect x="20" y="6710" width="335" height="72" fill="#20201F" stroke="none" stroke-width="0"/><text x="40" y="6748" fill="#FCFBF8" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0.8"><tspan x="40" dy="0">RESERVATION  ↗</tspan></text><text x="20" y="6827" fill="#74716B" font-family="Inter, sans-serif" font-size="11" font-weight="500" text-anchor="start" letter-spacing="0"><tspan x="20" dy="0">Navigation remains functional and obvious.</tspan></text>
